[package]
name = "bytes"
version = "6.0.0-beta.2"
authors = ["Use Ink <ink@use.ink>"]
edition = "2024"
publish = false

[dependencies]
ink = { version = "6.0.0-beta.2", default-features = false }

[dev-dependencies]
ink_e2e = { version = "6.0.0-beta.2" }

[lib]
path = "lib.rs"

[features]
default = ["std"]
std = [
    "ink/std"
]
ink-as-dependency = []
e2e-tests = []

[package.metadata.ink-lang]
abi = "sol"
